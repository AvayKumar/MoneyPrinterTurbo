server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100M;

    # Proxy API requests to FastAPI (rewrite /api/* → /api/v1/*)
    location /api/ {
        rewrite ^/api/(.*)$ /api/v1/$1 break;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Proxy TTI requests to image generation server (strip /tti prefix)
    location /tti/ {
        rewrite ^/tti/(.*)$ /$1 break;
        proxy_pass http://192.168.1.19:7082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Proxy TTV requests to video generation server (strip /ttv prefix)
    location /ttv/ {
        rewrite ^/ttv/(.*)$ /$1 break;
        proxy_pass http://192.168.1.19:7083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
